<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的 AI 協作風格是哪一派？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF3EC;
    --grid-line: rgba(20,46,32,0.08);
    --surface: #FFFFFF;
    --ink: #16261E;
    --ink-muted: #55695C;
    --accent: #1E9E5C;
    --accent-soft: rgba(30,158,92,0.16);
    --accent-2: #0E8C82;
    --border: rgba(20,46,32,0.16);
    --track-1: #B7C4B9;
    --track-2: #4FAE72;
    --track-3: #2FA86A;
    --track-4: #16824F;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1712;
      --grid-line: rgba(255,255,255,0.07);
      --surface: #172620;
      --ink: #EAF5EE;
      --ink-muted: #93AC9C;
      --accent: #4ADE80;
      --accent-soft: rgba(74,222,128,0.22);
      --accent-2: #2DD4BF;
      --border: rgba(255,255,255,0.12);
      --track-1: #3E4C46;
      --track-2: #2E8B6F;
      --track-3: #34C77F;
      --track-4: #7EE8A8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1712;
    --grid-line: rgba(255,255,255,0.07);
    --surface: #172620;
    --ink: #EAF5EE;
    --ink-muted: #93AC9C;
    --accent: #4ADE80;
    --accent-soft: rgba(74,222,128,0.22);
    --accent-2: #2DD4BF;
    --border: rgba(255,255,255,0.12);
    --track-1: #3E4C46;
    --track-2: #2E8B6F;
    --track-3: #34C77F;
    --track-4: #7EE8A8;
  }
  :root[data-theme="light"] {
    --bg: #EAF3EC;
    --grid-line: rgba(20,46,32,0.08);
    --surface: #FFFFFF;
    --ink: #16261E;
    --ink-muted: #55695C;
    --accent: #1E9E5C;
    --accent-soft: rgba(30,158,92,0.16);
    --accent-2: #0E8C82;
    --border: rgba(20,46,32,0.16);
    --track-1: #B7C4B9;
    --track-2: #4FAE72;
    --track-3: #2FA86A;
    --track-4: #16824F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--ink);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    display: flex;
    justify-content: center;
    padding: 32px 16px 56px;
  }

  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0; }

  .stage {
    width: 100%;
    max-width: 520px;
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 32px 26px;
    overflow-wrap: break-word;
  }

  .tag {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--accent-2);
    letter-spacing: 0.02em;
    margin-bottom: 14px;
  }

  .intro h1 {
    font-size: clamp(1.6rem, 5.5vw, 2.15rem);
    line-height: 1.3;
    font-weight: 700;
  }

  .intro p {
    color: var(--ink-muted);
    font-size: 1rem;
    line-height: 1.7;
    margin-top: 14px;
  }

  button {
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    border: none;
  }

  .primary-btn {
    margin-top: 24px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    font-size: 1.02rem;
    font-weight: 600;
    padding: 15px 20px;
    border-radius: 10px;
    transition: transform 0.15s ease;
  }
  .primary-btn:active { transform: scale(0.98); }

  .secondary-btn {
    margin-top: 12px;
    width: 100%;
    background: transparent;
    color: var(--ink);
    font-size: 0.95rem;
    font-weight: 500;
    padding: 13px 20px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
  }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.35s ease;
  }
  .progress-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.85rem;
    color: var(--ink-muted);
    white-space: nowrap;
  }

  .question h2 {
    font-size: clamp(1.15rem, 4.5vw, 1.4rem);
    line-height: 1.5;
    font-weight: 600;
  }

  .options {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    text-align: left;
    background: var(--bg);
    color: var(--ink);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 0.98rem;
    line-height: 1.5;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option-btn:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  /* Result */
  .result-eyebrow {
    font-size: 0.85rem;
    color: var(--ink-muted);
  }
  .result-title {
    font-size: clamp(1.7rem, 6.5vw, 2.3rem);
    font-weight: 700;
    color: var(--accent);
    margin-top: 6px;
  }

  .type-badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 20px 0 6px;
  }
  .type-badge {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    color: var(--ink-muted);
    opacity: 0.6;
  }
  .type-badge.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    opacity: 1;
    font-weight: 600;
  }

  .result-desc {
    color: var(--ink-muted);
    font-size: 0.98rem;
    line-height: 1.7;
    margin-top: 16px;
  }

  .divider {
    border: none;
    border-top: 1.5px dashed var(--border);
    margin: 24px 0 20px;
  }

  .webinar-info {
    font-family: 'Space Grotesk', sans-serif;
  }
  .webinar-time {
    color: var(--accent-2);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .webinar-title {
    font-size: 1.08rem;
    font-weight: 600;
    margin-top: 4px;
    line-height: 1.5;
  }

  .footer-note {
    text-align: center;
    color: var(--ink-muted);
    font-size: 0.78rem;
    margin-top: 18px;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

  // ---- Story-image (9:16) generation ----

  function wrapLines(ctx, text, maxWidth) {
    let lines = [];
    let line = '';
    for (const ch of String(text)) {
      const testLine = line + ch;
      if (ctx.measureText(testLine).width > maxWidth && line !== '') {
        lines.push(line);
        line = ch;
      } else {
        line = testLine;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawGaugeOnCanvas(ctx, cx, cy, r, pct, levelIndex) {
    const segColors = ['#3E4C46', '#2E8B6F', '#34C77F', '#7EE8A8'];
    for (let i = 0; i < 4; i++) {
      const segStart = (180 + i * 45) * Math.PI / 180;
      const segEnd = (180 + (i + 1) * 45) * Math.PI / 180;
      ctx.beginPath();
      ctx.strokeStyle = segColors[i];
      ctx.lineWidth = 42;
      ctx.lineCap = 'butt';
      ctx.arc(cx, cy, r, segStart, segEnd, false);
      ctx.stroke();
    }
    const needleAngle = (180 + (pct / 100) * 180) * Math.PI / 180;
    const nx = cx + (r - 76) * Math.cos(needleAngle);
    const ny = cy + (r - 76) * Math.sin(needleAngle);
    ctx.beginPath();
    ctx.strokeStyle = '#EAF5EE';
    ctx.lineWidth = 15;
    ctx.lineCap = 'round';
    ctx.moveTo(cx, cy);
    ctx.lineTo(nx, ny);
    ctx.stroke();
    ctx.beginPath();
    ctx.fillStyle = '#EAF5EE';
    ctx.arc(cx, cy, 24, 0, Math.PI * 2);
    ctx.fill();

    const tickXs = [cx - r - 28, cx - r * 0.37, cx + r * 0.37, cx + r + 28];
    const tickLabels = ['Lv.1', 'Lv.2', 'Lv.3', 'Lv.4'];
    ctx.font = "600 30px 'Space Grotesk'";
    tickLabels.forEach((t, i) => {
      ctx.textAlign = 'center';
      ctx.fillStyle = i === levelIndex ? '#4ADE80' : '#93AC9C';
      ctx.fillText(t, tickXs[i], cy + 78);
    });
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  // A row of pill badges, centered as a group. Always measures (so height is
  // known even on a measure-only pass); only paints when draw=true.
  function drawBadgeRow(ctx, cx, y, badges, gap, draw) {
    const metrics = badges.map(b => {
      ctx.font = b.font;
      const w = ctx.measureText(b.text).width + b.paddingX * 2;
      const h = b.fontSize + b.paddingY * 2;
      return Object.assign({}, b, { w, h });
    });
    const totalW = metrics.reduce((s, m) => s + m.w, 0) + gap * (metrics.length - 1);
    let x = cx - totalW / 2;
    const rowH = Math.max.apply(null, metrics.map(m => m.h));
    if (draw) {
      metrics.forEach(m => {
        ctx.fillStyle = m.bgColor;
        roundRect(ctx, x, y, m.w, m.h, m.h / 2);
        ctx.fill();
        ctx.fillStyle = m.textColor;
        ctx.font = m.font;
        ctx.textAlign = 'center';
        ctx.fillText(m.text, x + m.w / 2, y + m.h / 2 + m.fontSize * 0.36);
        x += m.w + gap;
      });
    }
    return rowH;
  }

  // Runs a layout plan top to bottom. With draw=false it only measures
  // (returns the total height consumed); with draw=true it paints the same
  // sequence starting at startY. Keeping one code path for both guarantees
  // the measured height and the drawn layout can never drift apart.
  function runPlan(ctx, steps, logoImg, cx, startY, draw) {
    let y = startY;
    steps.forEach(step => {
      if (step.type === 'wrap') {
        ctx.font = step.font;
        const lines = wrapLines(ctx, step.text, step.maxWidth);
        if (draw) {
          ctx.fillStyle = step.color;
          lines.forEach((l, i) => ctx.fillText(l, cx, y + i * step.lineHeight));
        }
        y += (lines.length - 1) * step.lineHeight + step.gapAfter;
      } else if (step.type === 'single') {
        ctx.font = step.font;
        if (draw) { ctx.fillStyle = step.color; ctx.fillText(step.text, cx, y); }
        y += step.gapAfter;
      } else if (step.type === 'fixed2') {
        ctx.font = step.font;
        if (draw) { ctx.fillStyle = step.color; ctx.fillText(step.line1, cx, y); }
        y += step.lineHeight;
        if (draw) ctx.fillText(step.line2, cx, y);
        y += step.gapAfter;
      } else if (step.type === 'gauge') {
        const gaugeCy = y + step.r;
        if (draw) drawGaugeOnCanvas(ctx, cx, gaugeCy, step.r, step.pct, step.levelIndex);
        y = gaugeCy + step.gapAfter;
      } else if (step.type === 'badgerow') {
        const rowH = drawBadgeRow(ctx, cx, y, step.badges, step.gap, draw);
        y += rowH + step.gapAfter;
      } else if (step.type === 'card') {
        const innerHeight = runPlan(ctx, step.innerSteps, null, cx, 0, false);
        const cardH = step.paddingTop + innerHeight + step.paddingBottom;
        if (draw) {
          ctx.fillStyle = step.bg;
          ctx.strokeStyle = step.border;
          ctx.lineWidth = 1.5;
          roundRect(ctx, cx - step.width / 2, y, step.width, cardH, step.radius);
          ctx.fill();
          ctx.stroke();
          runPlan(ctx, step.innerSteps, null, cx, y + step.paddingTop, true);
        }
        y += cardH + step.gapAfter;
      } else if (step.type === 'logo') {
        if (logoImg) {
          const h = step.width * (logoImg.height / logoImg.width);
          if (draw) ctx.drawImage(logoImg, cx - step.width / 2, y, step.width, h);
          y += h + step.gapAfter;
        }
      }
    });
    return y;
  }

  async function buildStoryCanvas(persona, pct, levelIndex) {
    try {
      await Promise.all([
        document.fonts.load("700 165px 'Space Grotesk'"),
        document.fonts.load("700 78px 'Space Grotesk'"),
        document.fonts.load("700 44px 'Space Grotesk'"),
        document.fonts.load("600 46px 'Space Grotesk'"),
        document.fonts.load("600 28px 'Space Grotesk'"),
        document.fonts.load("600 26px 'Space Grotesk'"),
        document.fonts.load("400 38px 'Inter'"),
        document.fonts.load("400 27px 'Inter'")
      ]);
      if (document.fonts.ready) await document.fonts.ready;
    } catch (e) { /* fall back to default font if loading fails */ }

    let logoImg = null;
    try { logoImg = await loadImage(LOGO_DATA_URI); } catch (e) { logoImg = null; }

    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    const cx = 540;

    ctx.textAlign = 'center';

    const infoCardInner = [
      { type: 'single', text: '實戰工作坊', font: "600 26px 'Space Grotesk'", color: '#2DD4BF', gapAfter: 72 },
      { type: 'fixed2', line1: '從 Copilot 到 Agent：', line2: 'MATLAB 工程開發的 AI 代理實戰', font: "700 44px 'Space Grotesk'", color: '#EAF5EE', lineHeight: 62, gapAfter: 68 },
      {
        type: 'badgerow', gap: 16, gapAfter: 60,
        badges: [
          { text: '10/14(三) 13:30–16:30', font: "600 28px 'Space Grotesk'", fontSize: 28, textColor: '#2DD4BF', bgColor: 'rgba(45,212,191,0.16)', paddingX: 22, paddingY: 12 },
          { text: '新竹實體工作坊', font: "600 28px 'Space Grotesk'", fontSize: 28, textColor: '#4ADE80', bgColor: 'rgba(74,222,128,0.14)', paddingX: 22, paddingY: 12 }
        ]
      },
      { type: 'fixed2', line1: '不只聽懂 AI Agent，更親手操作！', line2: '從 MCP 嵌入到 Agentic Toolkit，把 Agent 帶進你的開發流程。', font: "400 27px 'Inter'", color: '#93AC9C', lineHeight: 40, gapAfter: 0 }
    ];

    // Build the 4-type badge row for the image
    const allTypes = PERSONAS.map((p, i) => ({
      text: p.icon + ' ' + p.title,
      font: "600 30px 'Space Grotesk'",
      fontSize: 30,
      textColor: i === levelIndex ? '#4ADE80' : '#93AC9C',
      bgColor: i === levelIndex ? 'rgba(74,222,128,0.22)' : 'rgba(255,255,255,0.06)',
      paddingX: 24,
      paddingY: 14
    }));

    const steps = [
      { type: 'wrap', text: '《從 Copilot 到 Agent》風格測驗', font: "600 46px 'Space Grotesk'", color: '#2DD4BF', maxWidth: 900, lineHeight: 58, gapAfter: 160 },
      { type: 'single', text: persona.icon, font: "120px serif", color: '#EAF5EE', gapAfter: 180 },
      { type: 'wrap', text: persona.title, font: "700 120px 'Space Grotesk'", color: '#4ADE80', maxWidth: 920, lineHeight: 130, gapAfter: 100 },
      { type: 'wrap', text: persona.tagline, font: "400 42px 'Inter'", color: '#C9DBCF', maxWidth: 860, lineHeight: 54, gapAfter: 100 },
      { type: 'badgerow', gap: 14, gapAfter: 100, badges: allTypes },
      { type: 'card', innerSteps: infoCardInner, width: 920, paddingTop: 70, paddingBottom: 62, radius: 30, bg: 'rgba(255,255,255,0.05)', border: 'rgba(255,255,255,0.16)', gapAfter: 60 },
      { type: 'logo', width: 210, gapAfter: 0 }
    ];

    const contentHeight = runPlan(ctx, steps, logoImg, cx, 0, false);
    const topMargin = Math.max(70, (1920 - contentHeight) / 2);

    ctx.fillStyle = '#0E1712';
    ctx.fillRect(0, 0, 1080, 1920);
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= 1080; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1920); ctx.stroke(); }
    for (let gy = 0; gy <= 1920; gy += 54) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(1080, gy); ctx.stroke(); }
    ctx.textAlign = 'center';

    runPlan(ctx, steps, logoImg, cx, topMargin, true);

    return canvas;
  }

  function renderResult() {
    const persona = PERSONAS.find(p => score <= p.max);
    const pct = Math.round((score / 18) * 100);

    app.innerHTML = `
      <div class="card">
        <div class="result-eyebrow">你的 AI 協作風格是</div>
        <div class="result-title">${persona.icon} ${persona.title}</div>
        <div class="type-badges">
          ${PERSONAS.map(p => `<span class="type-badge ${p === persona ? 'active' : ''}">${p.icon} ${p.title}</span>`).join('')}
        </div>
        <p class="result-desc">${persona.desc}</p>

        <hr class="divider">

        <div class="webinar-info">
          <div class="webinar-time">10/14(三)13:30–16:30｜新竹實體工作坊</div>
          <div class="webinar-title">從 Copilot 到 Agent：MATLAB 工程開發的 AI 代理實戰</div>
        </div>
        <button class="secondary-btn" id="storyBtn">產生限動圖片</button>
        <div id="storyImgWrap"></div>
        <a href="${REGISTER_URL}" target="_blank" rel="noopener" style="text-decoration:none;">
          <button class="primary-btn">前往報名</button>
        </a>
        <button class="secondary-btn" id="retakeBtn">再測一次</button>
        <div class="footer-note" id="shareNote"></div>
      </div>
    `;

    document.getElementById('retakeBtn').addEventListener('click', () => {
      current = 0;
      score = 0;
      renderQuestion();
    });

    document.getElementById('storyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('storyBtn');
      const note = document.getElementById('shareNote');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '產生圖片中…';
      try {
        const levelIndex = PERSONAS.indexOf(persona);
        const canvas = await buildStoryCanvas(persona, pct, levelIndex);
        const dataUrl = canvas.toDataURL('image/png');

        // Show the image inline so it works in IG/LINE/FB in-app browsers
        let imgWrap = document.getElementById('storyImgWrap');
        if (!imgWrap) {
          imgWrap = document.createElement('div');
          imgWrap.id = 'storyImgWrap';
          imgWrap.style.cssText = 'margin-top:16px;text-align:center;';
          btn.parentNode.insertBefore(imgWrap, btn.nextSibling);
        }
        imgWrap.innerHTML = `
          <img src="${dataUrl}" alt="限動圖片" style="width:100%;max-width:320px;border-radius:12px;border:1.5px solid var(--border);" />
          <div style="color:var(--ink-muted);font-size:0.85rem;margin-top:10px;line-height:1.6;">
            📱 長按圖片 → 儲存到手機 → 上傳限動
          </div>
        `;
        note.textContent = '';
      } catch (err) {
        note.textContent = '圖片產生失敗，可以直接截圖這張結果卡分享';
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  }

  renderIntro();
})();
</script>
